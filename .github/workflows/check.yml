name: Ücretsiz oyun kontrolü

on:
  schedule:
    # 3 saatte bir, :05'te (UTC saatleri 0, 3, 6, 9, ...). Pazartesi 06:05 UTC
    # = 09:05 TSİ haftalık özetin çıktığı saat; 6, 3'ün katı olduğu için
    # bu çalışma korunur. Aralığı değiştirirsen 6'nın hâlâ dahil olduğundan emin ol.
    - cron: "5 */3 * * *"
    # GitHub zamanlanmış çalışmaları geciktirir veya atlar (ölçülen: 3 saat
    # yerine ortalama ~4,5 saat). Epic Perşembe 15:00 UTC'de yenilendiği için
    # hemen sonrasına üç ek şans: biri atlansa diğeri yakalar.
    - cron: "10 15-17 * * 4"
  workflow_dispatch:

permissions:
  contents: write   # seen.json'u geri commit edebilmek için

concurrency:
  group: freegames  # üst üste binen çalışmalar seen.json'da çakışmasın
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ücretsiz oyunları kontrol et
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python3 freegames.py

      - name: Durum dosyasını kaydet
        run: |
          if [ -n "$(git status --porcelain seen.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add seen.json
            git commit -m "chore: seen.json güncellendi"
            git push
          fi
