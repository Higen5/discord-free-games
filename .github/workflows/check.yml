name: Ücretsiz oyun kontrolü

on:
  schedule:
    # GitHub'ın izin verdiği en kısa aralık 5 dakika. GitHub yoğunlukta
    # zamanlanmış çalışmaları geciktirir veya atlar (3 saatlik cron'da ölçülen:
    # ortalama ~4,5 saat, en uzun boşluk 7,8 saat); sık cron bu boşlukları
    # küçültür. Haftalık özet ve tekrar bildirimi seen.json ile korunduğu için
    # sık çalışmak mesaj tekrarına yol açmaz.
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write   # seen.json'u geri commit edebilmek için

concurrency:
  group: freegames  # üst üste binen çalışmalar seen.json'da çakışmasın
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ücretsiz oyunları kontrol et
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python3 freegames.py

      - name: Durum dosyasını kaydet
        run: |
          if [ -n "$(git status --porcelain seen.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add seen.json
            git commit -m "chore: seen.json güncellendi"
            git push
          fi
